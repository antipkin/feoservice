# docker-compose.prod.yml
version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: feoservice_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feoservice_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feoservice_backend_prod
    restart: always
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    networks:
      - feoservice_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: feoservice_frontend_prod
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - feoservice_net

  nginx:
    image: nginx:alpine
    container_name: feoservice_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - feoservice_net

volumes:
  postgres_data_prod:
  uploads_data:

networks:
  feoservice_net:
    driver: bridge